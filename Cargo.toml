[package]
name = "fbim"
version = "0.5.0"
edition = "2021"
description = "File-Based Issue Management"
license = "MIT"
repository = "https://github.com/shishidosoichiro/fbim"
keywords = ["issue-tracker", "cli", "markdown", "git"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  "issues/",
  ".claude/",
  "skills/",
  ".github/",
  "CLAUDE.md",
  ".coveragerc",
  ".gitlab-ci.yml",
  "upload-macos.sh",
  "cliff.toml",
]

[[bin]]
name = "fbim"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
