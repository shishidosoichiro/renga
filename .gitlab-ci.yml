default:
  image: rust:latest

stages:
  - test
  - build

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUST_BACKTRACE: "1"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

test:
  stage: test
  script:
    - cargo fmt --check
    - cargo clippy -- -D warnings
    - cargo test
    - cargo doc --no-deps

build:
  stage: build
  script:
    - cargo build --release
  artifacts:
    name: "fbim-${CI_COMMIT_REF_SLUG}"
    paths:
      - target/release/fbim
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
