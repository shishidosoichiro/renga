default:
  image: rust:latest

stages:
  - test
  - build
  - publish

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUST_BACKTRACE: "1"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

test:
  stage: test
  before_script:
    - curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz
        | tar xzf - -C /usr/local/bin
  script:
    - cargo fmt --check
    - cargo clippy -- -D warnings
    - cargo llvm-cov --summary-only
    - cargo doc --no-deps
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+\.\d+%)/'

build:
  stage: build
  script:
    - cargo build --release
  artifacts:
    name: "renga-${CI_COMMIT_REF_SLUG}"
    paths:
      - target/release/renga
    expire_in: 90 days

publish:
  stage: publish
  needs: [build]
  script:
    - |
      curl --fail --insecure -sS --upload-file target/release/renga \
        -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/renga/${CI_COMMIT_REF_SLUG}/renga-linux-x86_64"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
