name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: tar czf fbim-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release fbim
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: Compress-Archive target/${{ matrix.target }}/release/fbim.exe fbim-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: fbim-${{ matrix.target }}.${{ matrix.archive }}
